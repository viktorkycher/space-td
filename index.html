<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060914">
<title>Космическая Оборона</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#060914;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#e8f0ff;user-select:none;}
#app{position:fixed;inset:0;overflow:hidden;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;}
.screen.active{display:flex;}
#menu{align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 30% 20%,rgba(90,60,220,.35),transparent 55%),radial-gradient(circle at 75% 75%,rgba(0,180,255,.25),transparent 55%),#060914;padding:24px;}
.gameTitle{font-size:34px;line-height:1.05;letter-spacing:2px;text-align:center;font-weight:900;background:linear-gradient(180deg,#8fe9ff,#4f8cff 60%,#b06bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(90,160,255,.55));}
.menuStats{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;justify-content:center;}
.stat{background:rgba(20,32,60,.85);border:1px solid rgba(90,160,255,.3);padding:6px 12px;border-radius:14px;font-size:13px;color:#9fb6dd;}
.stat b{color:#fff;font-size:15px;}
.menuButtons{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:10px;}
.bigBtn{width:100%;padding:16px;border:none;border-radius:18px;font-size:19px;font-weight:800;letter-spacing:1px;background:linear-gradient(180deg,#3ea8ff,#1f5fd6);color:#fff;cursor:pointer;box-shadow:0 6px 0 #0e2f6b,0 0 30px rgba(62,168,255,.45);transition:transform .08s;}
.bigBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #0e2f6b;}
.bigBtn:disabled{background:#243352;color:#5c6f8f;box-shadow:none;}
.midBtn{width:100%;padding:14px;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;background:rgba(22,34,62,.9);color:#cfe0ff;border:1px solid rgba(90,160,255,.35);display:flex;align-items:center;justify-content:center;gap:10px;}
.midBtn:active{background:rgba(35,52,90,.9);}
.badge{background:#ff5c8a;color:#fff;border-radius:10px;padding:1px 8px;font-size:13px;font-weight:800;}

#battle{background:#04060f;}
.topbar{display:flex;align-items:center;gap:6px;padding:8px 8px;padding-top:calc(8px + env(safe-area-inset-top));background:rgba(10,18,36,.95);border-bottom:1px solid rgba(90,160,255,.18);font-size:12px;font-weight:700;}
.topbar .hud{background:rgba(30,46,80,.6);padding:5px 8px;border-radius:10px;display:flex;align-items:center;gap:4px;}
.topbar .spacer{flex:1;}
.iconBtn{background:rgba(90,160,255,.15);border:1px solid rgba(90,160,255,.4);color:#5ee7ff;width:30px;height:30px;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.iconBtn:active{background:rgba(90,160,255,.3);}
.closeBtn{background:rgba(255,90,120,.16);border:1px solid rgba(255,90,120,.4);color:#ff8fa8;width:30px;height:30px;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer;}

.progressBarBg{width:100%;height:4px;background:rgba(0,0,0,0.5);}
.progressBarFill{height:100%;background:#5ee7ff;transition:width 0.2s;}

.field{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:2px 4px;position:relative;}
#game{display:block;height:100%;width:auto;max-width:100%;touch-action:none;border-radius:10px;}
.bottombar{padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(10,18,36,.95);border-top:1px solid rgba(90,160,255,.18);}
.bottombar .row{display:flex;gap:10px;align-items:center;}
.wavePreview{font-size:12px;color:#8fa6cc;margin-bottom:6px;text-align:center;}

.picker{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(8,14,28,.97);border-top:1px solid rgba(90,160,255,.3);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;backdrop-filter:blur(8px);z-index:10;}
.picker.hidden{display:none;}
.pickBtn{background:rgba(24,38,70,.9);border:2px solid #333;border-radius:15px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#fff;}
.pickBtn.disabled{opacity:.35;pointer-events:none;}
.pickBtn:active{background:rgba(40,62,110,.9);}
.pickName{font-size:12px;font-weight:800;}
.pickDmg{font-size:9px;color:#8fa6cc;}
.pickCost{font-size:11px;font-weight:700;color:#ffd257;}
.pickCancel{grid-column:span 3;width:100%;background:rgba(255,90,120,.14);border:2px solid rgba(255,90,120,.4);color:#ff8fa8;border-radius:12px;padding:10px;font-size:16px;font-weight:800;cursor:pointer;text-align:center;}

.towerInfoPanel{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(8,14,28,.97);border-top:1px solid rgba(90,160,255,.3);display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(8px);z-index:10;}
.towerInfoPanel.hidden{display:none;}
.infoText{font-size:13px;color:#9fb6dd;line-height:1.4;text-align:center;}
.targetRow{display:flex;gap:6px;justify-content:center;margin-bottom:4px;}
.targetBtn{flex:1;background:rgba(30,46,80,.6);border:1px solid rgba(90,160,255,.2);color:#8fa6cc;padding:8px;border-radius:10px;font-size:12px;font-weight:bold;cursor:pointer;}
.targetBtn.active{background:rgba(94,231,255,.2);border-color:#5ee7ff;color:#5ee7ff;}
.actionRow{display:flex;gap:8px;}
.infoBtn{flex:1;background:rgba(90,160,255,.15);border:2px solid rgba(90,160,255,.4);color:#5ee7ff;border-radius:12px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;}
.sellBtn{width:50px;background:rgba(255,90,120,.14);border:2px solid rgba(255,90,120,.4);color:#ff8fa8;border-radius:12px;font-size:18px;font-weight:800;cursor:pointer;}
.cancelBtn{width:50px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);color:#fff;border-radius:12px;font-size:18px;font-weight:800;cursor:pointer;}

.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center;background:rgba(4,8,18,.92);backdrop-filter:blur(6px);}
.overlay.hidden{display:none;}
.pauseOverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,8,18,.7);z-index:40;font-size:28px;font-weight:900;letter-spacing:4px;color:#fff;backdrop-filter:blur(4px);}
.pauseOverlay.hidden{display:none;}
.resultTitle{font-size:32px;font-weight:900;letter-spacing:2px;}
.resultTitle.win{color:#5dff9b;text-shadow:0 0 28px rgba(93,255,155,.6);}
.resultTitle.lose{color:#ff5c8a;text-shadow:0 0 28px rgba(255,92,138,.6);}
.resultLine{font-size:16px;color:#b8c9e6;}
#chests,#collection{background:radial-gradient(circle at 50% 0%,rgba(60,40,160,.3),transparent 60%),#060914;}
.screenHead{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid rgba(90,160,255,.18);}
.screenHead h2{font-size:18px;letter-spacing:2px;font-weight:800;}
.screenHead .spacer{flex:1;}
.backBtn{background:rgba(30,46,80,.7);border:1px solid rgba(90,160,255,.3);color:#cfe0ff;width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;}
.scrollArea{flex:1;overflow-y:auto;padding:14px;padding-bottom:calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.empty{text-align:center;color:#6b7fa3;padding:40px 20px;line-height:1.7;font-size:15px;}
.chestItem{background:rgba(18,28,52,.9);border:2px solid #333;border-radius:18px;padding:20px;margin-bottom:12px;text-align:center;cursor:pointer;transition:transform .1s;}
.chestItem:active{transform:scale(.97);}
.chestBox{font-size:46px;filter:drop-shadow(0 0 18px var(--c));}
.chestName{font-size:17px;font-weight:800;margin-top:6px;letter-spacing:1px;}
.chestHint{font-size:12px;color:#7d90b3;margin-top:4px;}
.shopGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;border-bottom:1px solid rgba(90,160,255,.2);padding-bottom:20px;}
.shopBtn{background:rgba(24,38,70,.9);border:1px solid rgba(90,160,255,.3);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;}
.shopBtn:active{background:rgba(40,62,110,.9);}
.card{display:flex;align-items:center;gap:12px;background:rgba(18,28,52,.9);border:1px solid rgba(90,160,255,.2);border-radius:18px;padding:13px;margin-bottom:11px;}
.cardIcon{width:50px;height:50px;border-radius:14px;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;flex-shrink:0;}
.cardBody{flex:1;min-width:0;}
.cardTitle{font-size:15px;font-weight:800;}
.cardTitle .lvl{font-size:11px;color:#ffd257;background:rgba(255,210,87,.13);padding:2px 7px;border-radius:7px;margin-left:5px;}
.cardStats{font-size:11px;color:#8fa6cc;margin-top:3px;}
.cardCards{font-size:12px;color:#b8c9e6;margin-top:3px;}
.upBtn{background:linear-gradient(180deg,#3ea8ff,#1f5fd6);border:none;color:#fff;padding:11px 13px;border-radius:13px;font-size:12px;font-weight:800;cursor:pointer;flex-shrink:0;}
.upBtn:disabled{background:#243352;color:#5c6f8f;}
.bigChest{font-size:110px;filter:drop-shadow(0 0 40px var(--c));cursor:pointer;}
.bigChest.shake{animation:shake .42s infinite;}
@keyframes shake{0%,100%{transform:rotate(0) scale(1);}25%{transform:rotate(-9deg) scale(1.07);}75%{transform:rotate(9deg) scale(1.07);}}
.chestTapHint{font-size:15px;color:#9fb6dd;margin-top:14px;}
.rewardRow{display:flex;align-items:center;gap:12px;background:rgba(22,34,62,.9);border:1px solid rgba(90,160,255,.25);border-radius:16px;padding:13px 18px;min-width:250px;font-size:16px;font-weight:700;animation:pop .35s backwards;}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(14px);}to{opacity:1;transform:none;}}
.rewardIcon{font-size:24px;}
@keyframes bossFlash {0%, 100% { background-color: rgba(255,0,60,0.1); } 50% { background-color: rgba(255,0,60,0.4); }}
.bossWarning { animation: bossFlash 0.5s infinite; position: absolute; top: 20%; left: 10%; right: 10%; text-align: center; color: #ff0044; font-size: 24px; font-weight: 900; z-index: 20; text-shadow: 0 0 10px #ff0044; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <div id="menu" class="screen active">
    <h1 class="gameTitle">КОСМИЧЕСКАЯ<br>ОБОРОНА</h1>
    <div class="menuStats">
      <div class="stat">🪙 <b id="menuCoins">0</b></div>
      <div class="stat">🏆 Сектор <b id="menuLevel">1</b></div>
      <div class="stat">💀 Убито: <b id="statKills">0</b></div>
      <div class="stat">💰 Всего: <b id="statGold">0</b></div>
    </div>
    <div class="menuButtons">
      <button class="bigBtn" id="playBtn">ИГРАТЬ</button>
      <button class="midBtn" id="dailyBtn">🎁 ЕЖЕДНЕВНАЯ НАГРАДА</button>
      <button class="midBtn" id="chestsBtn">📦 СУНДУКИ <span class="badge" id="chestBadge">0</span></button>
      <button class="midBtn" id="collectionBtn">🛠 БАШНИ</button>
      <button class="midBtn" id="resetBtn" style="margin-top:10px; border-color:rgba(255,90,120,.4); color:#ff8fa8;">🗑 СБРОСИТЬ ПРОГРЕСС</button>
      <div style="display:flex; gap:10px; width:100%;">
        <button class="midBtn" id="helpBtn" style="flex:1; font-size:20px;">❓</button>
        <button class="midBtn" id="shakeBtn" style="flex:2; font-size:14px;" onclick="toggleShake()">📳 Тряска ВКЛ</button>
      </div>
    </div>
  </div>
  
  <div id="battle" class="screen">
    <div class="topbar">
      <div class="hud">❤️ <span id="hudLives">10</span></div>
      <div class="hud">🪙 <span id="hudCoins">0</span></div>
      <div class="hud">🌊 <span id="hudWave">0/5</span></div>
      <div class="hud" id="hudTimer" style="color:#5ee7ff; background:rgba(94,231,255,.15); border:1px solid rgba(94,231,255,.3);">⏳ <span id="timerVal">15s</span></div>
      <div class="spacer"></div>
      <button class="iconBtn" id="muteBtn">🔊</button>
      <button class="iconBtn" id="speedBtn">x1</button>
      <button class="iconBtn" id="pauseBtn">⏸</button>
      <button class="closeBtn" id="exitBattleBtn">✕</button>
    </div>
    <div class="progressBarBg"><div class="progressBarFill" id="waveProgressFill" style="width: 0%;"></div></div>
    
    <div class="field">
      <canvas id="game"></canvas>
      <div id="pauseOverlay" class="pauseOverlay hidden">ПАУЗА</div>
    </div>
    
    <div class="bottombar" id="battleBottom">
      <div class="wavePreview" id="wavePreviewText">Приготовьтесь...</div>
      <div class="row"><button id="startWaveBtn" class="bigBtn">НАЧАТЬ ВОЛНУ</button></div>
    </div>
    <div id="towerPicker" class="picker hidden"></div>
    <div id="towerInfo" class="towerInfoPanel hidden"></div>
    <div id="battleResult" class="overlay hidden"></div>
  </div>
  
  <div id="chests" class="screen">
    <div class="screenHead"><button class="backBtn" data-back>←</button><h2>СУНДУКИ</h2><div class="spacer"></div></div>
    <div id="chestList" class="scrollArea"></div>
  </div>
  <div id="collection" class="screen">
    <div class="screenHead"><button class="backBtn" data-back>←</button><h2>БАШНИ</h2><div class="spacer"></div></div>
    <div id="collectionList" class="scrollArea"></div>
  </div>
  <div id="chestModal" class="overlay hidden"></div>
</div>

<script>
/* ============ ЗВУКИ (Синтез) ============ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if(!audioCtx || audioCtx.state === 'suspended' || state.muted) return;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
  if (type === 'shoot') { osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); }
  else if (type === 'explode') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.3); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3); }
  else if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(now); osc.stop(now + 0.05); }
}
document.body.addEventListener('pointerdown', () => { if(audioCtx.state === 'suspended') audioCtx.resume(); }, {once: true});

/* ============ СОХРАНЕНИЕ ============ */
const SAVE_KEY = 'spaceTD_v4';
const MAX_LEVEL = 8;
const TOTAL_WAVES = 5;
const UPGRADE_COST = [5, 15, 40, 100, 250, 600, 1500];
function defaultState(){
  return { coins:200, battleLevel:1, towers:{blaster:{level:1,cards:0},plasma:{level:1,cards:0},laser:{level:1,cards:0},frost:{level:1,cards:0},tesla:{level:1,cards:0},missile:{level:1,cards:0}}, chests:['common'], kills:0, totalGold:0, lastDaily:0, muted:false, shakeOn:true };
}
let state;
try { state = JSON.parse(localStorage.getItem(SAVE_KEY)) || defaultState(); } catch(e){ state = defaultState(); }
if(!state.towers) state = defaultState();
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }

/* ============ БАШНИ ============ */
const TOWERS = {
  blaster:{ name:'Бластер', cost:50,  color:'#5ee7ff', dmg:10, range:95,  rate:0.50, splash:0,  projSpeed:430, kind:'bolt' },
  plasma: { name:'Плазма',  cost:85,  color:'#ff6ee7', dmg:20, range:88,  rate:1.25, splash:45, projSpeed:270, kind:'orb'  },
  laser:  { name:'Лазер',   cost:110, color:'#ffd257', dmg:6,  range:150, rate:0.22, splash:0,  projSpeed:0,   kind:'laser'},
  frost:  { name:'Криотур', cost:75,  color:'#00ffff', dmg:8,  range:100, rate:1.00, splash:0,  projSpeed:350, kind:'frost', slow: 0.5 },
  tesla:  { name:'Тесла',   cost:120, color:'#ffffff', dmg:15, range:90,  rate:0.80, splash:0,  projSpeed:0,   kind:'tesla'},
  missile:{ name:'Ракета',  cost:150, color:'#ff3333', dmg:45, range:160, rate:1.80, splash:60, projSpeed:200, kind:'missile'}
};
const TOWER_KEYS = Object.keys(TOWERS);

function towerStats(key, battleLvl=0, hasAdjBuff=false){
  const base = TOWERS[key], lvl = state.towers[key].level + battleLvl, m = Math.pow(1.22, lvl - 1);
  let dmg = base.dmg * m;
  if (hasAdjBuff) dmg *= 1.15; // Бонус соседства
  return { dmg: dmg, range: base.range + 4 * (lvl - 1), rate: base.rate, splash: base.splash ? base.splash + 2 * (lvl - 1) : 0 };
}

/* ============ СУНДУКИ И МАГАЗИН ============ */
const CHEST_DEF = {
  common:{ name:'Обычный', color:'#7ec8ff', cards:4, coins:70, price: 150 },
  rare:{ name:'Редкий', color:'#4de1a0', cards:9, coins:180, price: 400 },
  epic:{ name:'Эпический', color:'#c07bff', cards:18, coins:400, price: 1000 },
  legendary:{ name:'Легендарный', color:'#ffd257', cards:35, coins:900, price: 2500 }
};
function rollChest(lvl){
  const r = Math.random() * 100;
  if(r < 2 + lvl * 0.6) return 'legendary';
  if(r < 13 + lvl * 1.6) return 'epic';
  if(r < 42 + lvl * 2) return 'rare';
  return 'common';
}

/* ============ КАРТА ============ */
const CELL = 40, COLS = 10, ROWS = 16;
const W = COLS * CELL, H = ROWS * CELL;
const MAPS = [
  [[0,-1],[0,0],[8,0],[8,3],[1,3],[1,6],[8,6],[8,9],[1,9],[1,12],[8,12],[8,15],[4,15],[4,16]],
  [[9,-1],[9,0],[1,0],[1,3],[8,3],[8,6],[1,6],[1,9],[8,9],[8,12],[1,12],[1,15],[5,15],[5,16]],
  [[0,2],[7,2],[7,13],[2,13],[2,5],[4,5],[4,10],[5,10],[5,7],[0,7],[0,16]]
];
let PATH_GRID, pathCells, WP, SEG, TOTAL_LEN;
function loadMap(mapIndex) {
  PATH_GRID = MAPS[mapIndex % MAPS.length];
  pathCells = new Set();
  for(let i=0; i<PATH_GRID.length-1; i++){
    let [c1,r1] = PATH_GRID[i], [c2,r2] = PATH_GRID[i+1];
    const dc = Math.sign(c2-c1), dr = Math.sign(r2-r1);
    let c = c1, r = r1;
    pathCells.add(c+','+r);
    while(c !== c2 || r !== r2){ c += dc; r += dr; pathCells.add(c+','+r); }
  }
  WP = PATH_GRID.map(([c,r]) => ({ x:c*CELL+CELL/2, y:r*CELL+CELL/2 }));
  SEG = []; TOTAL_LEN = 0;
  for(let i=0;i<WP.length-1;i++){
    const d = Math.hypot(WP[i+1].x-WP[i].x, WP[i+1].y-WP[i].y);
    SEG.push(d); TOTAL_LEN += d;
  }
}
function posAt(d){
  if(d <= 0) return { x:WP[0].x, y:WP[0].y };
  let acc = 0;
  for(let i=0;i<SEG.length;i++){
    if(acc + SEG[i] >= d){
      const t = (d - acc) / SEG[i], a = WP[i], b = WP[i+1];
      return { x:a.x + (b.x-a.x)*t, y:a.y + (b.y-a.y)*t };
    }
    acc += SEG[i];
  }
  return { x:WP[WP.length-1].x, y:WP[WP.length-1].y };
}
function isBuildable(c,r){ return c>=0 && c<COLS && r>=0 && r<ROWS && !pathCells.has(c+','+r); }

/* ============ CANVAS ============ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * DPR; canvas.height = H * DPR;
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

/* ============ СПРАЙТЫ ============ */
const IMAGES = {};
function makeTransparent(img) {
  try {
    const cv = document.createElement('canvas');
    cv.width = img.width; cv.height = img.height;
    const c = cv.getContext('2d'); c.drawImage(img, 0, 0);
    const imgData = c.getImageData(0, 0, cv.width, cv.height); const p = imgData.data;
    for (let i = 0; i < p.length; i += 4) {
      const r = p[i], g = p[i+1], b = p[i+2];
      if (g > 100 && g > r * 1.2 && g > b * 1.2) p[i+3] = 0; 
      else if (g > r && g > b && g - Math.max(r,b) > 15) p[i+1] = Math.max(r, b); 
    }
    c.putImageData(imgData, 0, 0); return cv;
  } catch(e) { return img; }
}

function makeTowerBase(mainColor){ const { cv, cx } = mkCanvas(80, 80); const C = 40; cx.fillStyle = 'rgba(0,0,0,0.45)'; cx.beginPath(); cx.arc(C, C + 2, 32, 0, 6.3); cx.fill(); const rg = cx.createRadialGradient(C - 10, C - 10, 5, C, C, 32); rg.addColorStop(0, '#2d3d5a'); rg.addColorStop(0.7, '#0f1a32'); rg.addColorStop(1, '#060b18'); cx.beginPath(); cx.arc(C, C, 30, 0, 6.3); cx.fillStyle = rg; cx.fill(); cx.strokeStyle = mainColor; cx.lineWidth = 2.5; cx.shadowBlur = 12; cx.shadowColor = mainColor; cx.beginPath(); cx.arc(C, C, 30, 0, 6.3); cx.stroke(); return cv; }

function generateWave(waveNum, battleLevel){
  const hpBase = 28 * Math.pow(1.26, battleLevel - 1) * Math.pow(1.22, (waveNum > 5 ? 5 : waveNum) - 1);
  let count = 5 + (waveNum > 5 ? 10 : waveNum * 2);
  const list = [];
  for(let i = 0; i < count; i++){
    let type = 'grunt';
    if(Math.random() < 0.05) type = 'golden';
    else if(waveNum >= 2 && i % 3 === 0) type = 'fast';
    else if(waveNum >= 3 && i % 5 === 4) type = 'tank';
    if((waveNum === 5 || waveNum % 5 === 0) && i === count - 1) type = 'boss';
    
    const hp = type === 'boss' ? hpBase * 15 : type === 'tank' ? hpBase * 3.2 : type === 'fast' ? hpBase * 0.6 : type === 'golden' ? hpBase * 0.5 : hpBase;
    const speed = type === 'boss' ? 30 : type === 'tank' ? 55 : type === 'fast' ? 120 : type === 'golden' ? 150 : 75;
    list.push({ t:i * 0.62, hp, speed, type });
  }
  return list;
}

function getWavePreview(waveNum){
  if(waveNum % 5 === 0) return "⚠️ БОСС И ТАНКИ!";
  if(waveNum > 5) return "БЕСКОНЕЧНЫЙ РЕЖИМ (Волна " + waveNum + ")";
  return "Волна " + waveNum;
}

function startWave(){
  if(!battle || battle.state !== 'prep') return;

  for(const s of list) battle.spawnQueue.push({ t:battle.time + s.t, hp:s.hp, speed:s.speed, type:s.type });
  battle.state = 'wave';
  hidePickers(); updateHUD();
}

function spawnParticles(x, y, count, color, opts = {}){
  if(!battle) return;
  for(let i = 0; i < count; i++){
    const ang = Math.random() * Math.PI * 2;
    const speed = (opts.speed || 80) * (0.4 + Math.random() * 0.9);
    battle.particles.push({ x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed - (opts.lift || 0), life: (opts.life || 0.45) * (0.6 + Math.random() * 0.7), maxLife: opts.life || 0.45, size: (opts.size || 2.5) * (0.6 + Math.random() * 0.9), color: opts.colors ? opts.colors[Math.floor(Math.random() * opts.colors.length)] : color, gravity: opts.gravity || 0, glow: opts.glow !== false });
  }
}
function spawnDamageText(x, y, text, color) {
  if(!battle) return;
  battle.damageTexts.push({ x, y, text, color, life: 0.8, max: 0.8, vy: -40 });
}
function addShake(a){ if(battle && state.shakeOn) battle.shake = Math.min(1.2, battle.shake + a); }

function damageEnemy(e, dmg, color='#fff'){
  if(e.hp <= 0) return;
  
  // Щит босса
  if(e.shield > 0) {
    const absorbed = Math.min(e.shield, dmg);
    e.shield -= absorbed;
    dmg -= absorbed;
    spawnDamageText(e.px, e.py - 10, Math.round(absorbed), '#5ee7ff');
  }
  
  if (dmg > 0) {
    e.hp -= dmg;
    spawnDamageText(e.px, e.py - 10, Math.round(dmg), color);
  }
  
  spawnParticles(e.px, e.py, 3, e.color, { speed:60, life:0.25, size:2 });
  
  if(e.hp <= 0){
    e.hp = 0;
    battle.combo++; battle.comboTimer = 2.0;
    let reward = Math.max(5, Math.round(e.maxHp / 6));
    if (e.type === 'golden') reward *= 10;
    if (battle.combo > 5) reward = Math.round(reward * 1.5);
    
    state.coins += reward; battle.earned += reward; state.totalGold += reward; state.kills++; save();
    
    battle.effects.push({ type:'boom', x:e.px, y:e.py, r:20, life:0.26, max:0.26, color:e.color });
    spawnParticles(e.px, e.py, 14, e.color, { speed:120, life:0.55, size:2.8 });
    playSound('explode'); addShake(0.15); updateHUD();
  }
}

function fire(t, target, st){
  t.recoil = 1;
  const mx = t.x + Math.cos(t.angle || 0) * 22;
  const my = t.y + Math.sin(t.angle || 0) * 22;
  spawnParticles(mx, my, 5, TOWERS[t.key].color, { speed:150, life:0.15, size:3 });
  playSound('shoot');

  if(t.key === 'laser'){
    damageEnemy(target, st.dmg, '#ffd257');
    battle.effects.push({ type:'beam', x1:t.x, y1:t.y, x2:target.px, y2:target.py, life:0.1, max:0.1, color:'#ffd257' });
    spawnParticles(target.px, target.py, 2, '#ffd257', { speed:40, life:0.15, size:2 });
  } else if(t.key === 'tesla'){
    damageEnemy(target, st.dmg, '#ffffff');
    battle.effects.push({ type:'beam', x1:t.x, y1:t.y, x2:target.px, y2:target.py, life:0.15, max:0.15, color:'#ffffff' });
    // Цепная молния
    let chain = 1;
    for(const e of battle.enemies) {
      if(e !== target && e.hp > 0 && Math.hypot(e.px-target.px, e.py-target.py) < 80 && chain < 4) {
        damageEnemy(e, st.dmg * 0.6, '#ffffff');
        battle.effects.push({ type:'beam', x1:target.px, y1:target.py, x2:e.px, y2:e.py, life:0.15, max:0.15, color:'#ffffff' });
        chain++;
      }
    }
  } else {
    const def = TOWERS[t.key];
    battle.projectiles.push({ x:t.x, y:t.y, target, dmg:st.dmg, splash:st.splash, speed:def.projSpeed, color:def.color, kind:def.kind, tx:target.px, ty:target.py, trail:[] });
  }
}

function update(dt){
  if(!battle || battle.state === 'won' || battle.state === 'lost' || battle.paused) return;
  dt *= battle.speed;
  battle.time += dt;

  if(battle.undo && Date.now() > battle.undo.expire) battle.undo = null;
  if(battle.comboTimer > 0) { battle.comboTimer -= dt; if(battle.comboTimer <= 0) battle.combo = 0; }

  if(battle.state === 'prep') {
    battle.prepTimer -= dt;
    updateHUD();
    if(battle.prepTimer <= 0) startWave();
  }

  while(battle.spawnQueue.length && battle.spawnQueue[0].t <= battle.time){
    const s = battle.spawnQueue.shift();
    battle.enemies.push({ 
      d:0, hp:s.hp, maxHp:s.hp, speed:s.speed, type:s.type, slow:0, 
      px:WP[0].x, py:WP[0].y, 
      color: s.type === 'boss' ? '#ff0044' : s.type === 'tank' ? '#ff5c8a' : s.type === 'fast' ? '#7dff9b' : s.type === 'golden' ? '#ffd700' : '#8b7bff',
      spawnAnim: 1, shield: s.type === 'boss' ? s.hp * 0.5 : 0, maxShield: s.type === 'boss' ? s.hp * 0.5 : 0, fadeOut: 0
    });
  }
  
  for(let i = battle.enemies.length - 1; i >= 0; i--){
    const e = battle.enemies[i];
    if(e.hp <= 0){ 
      e.fadeOut += dt * 4;
      if(e.fadeOut >= 1) battle.enemies.splice(i, 1); 
      continue; 
    }
    if(e.spawnAnim > 0) e.spawnAnim = Math.max(0, e.spawnAnim - dt * 3);
    
    // Замедление
    if(e.slowTimer > 0) e.slowTimer -= dt;
    const sp = e.slowTimer > 0 ? e.speed * 0.5 : e.speed;
    
    e.d += sp * dt;
    if(e.d >= TOTAL_LEN){
      battle.enemies.splice(i, 1);
      battle.lives -= (e.type === 'tank' ? 2 : e.type === 'boss' ? 5 : 1);
      battle.effects.push({ type:'boom', x:WP[WP.length-1].x, y:WP[WP.length-1].y, r:26, life:0.3, max:0.3, color:'#ff5c5c' });
      addShake(0.5); playSound('explode'); updateHUD();
      if(battle.lives <= 0){ battle.lives = 0; updateHUD(); endBattle(false); return; }
      continue;
    }
    const p = posAt(e.d); e.px = p.x; e.py = p.y;
  }

  for(const t of battle.towers){
    if(t.cd > 0) t.cd -= dt;
    if(t.recoil > 0) t.recoil = Math.max(0, t.recoil - dt * 6);
    
    // Бонус соседства
    const hasBuff = battle.towers.some(o => o !== t && Math.abs(o.c - t.c) <= 1 && Math.abs(o.r - t.r) <= 1);
    const st = towerStats(t.key, t.upLvl, hasBuff);
    
    let best = null;
    const r2 = st.range * st.range;
    let bestVal = t.targeting === 'first' ? -1 : t.targeting === 'last' ? 99999 : t.targeting === 'strong' ? -1 : 99999;
    
    for(const e of battle.enemies){
      if(e.hp <= 0) continue;
      const dx = e.px - t.x, dy = e.py - t.y;
      if(dx*dx + dy*dy <= r2){
        let val = t.targeting === 'first' ? e.d : t.targeting === 'last' ? -e.d : t.targeting === 'strong' ? e.hp : -e.hp;
        if((t.targeting === 'first' || t.targeting === 'strong') ? val > bestVal : val < bestVal) {
          bestVal = val; best = e;
        }
      }
    }
    if(best){
      t.angle = Math.atan2(best.py - t.y, best.px - t.x);
      if(t.cd <= 0){ t.cd = st.rate; fire(t, best, st); }
    }
  }

  for(let i = battle.projectiles.length - 1; i >= 0; i--){
    const p = battle.projectiles[i];
    if(p.target && p.target.hp > 0){ p.tx = p.target.px; p.ty = p.target.py; }
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const dist = Math.hypot(dx, dy); const step = p.speed * dt;
    if(!p.trail) p.trail = [];
    p.trail.push({ x:p.x, y:p.y }); if(p.trail.length > 7) p.trail.shift();
    if(dist <= step || dist < 1){
      if(p.splash > 0){
        battle.effects.push({ type:'boom', x:p.tx, y:p.ty, r:p.splash, life:0.35, max:0.35, color:p.color });
        spawnParticles(p.tx, p.ty, 16, p.color, { speed:150, life:0.5, size:2.8 });
        addShake(0.2); playSound('explode');
        for(const e of battle.enemies){ if(e.hp > 0 && Math.hypot(e.px-p.tx, e.py-p.ty) <= p.splash) damageEnemy(e, p.dmg, p.color); }
      } else if(p.target && p.target.hp > 0) {
        damageEnemy(p.target, p.dmg, p.color);
        if(p.kind === 'frost') p.target.slowTimer = 2.0;
      }
      battle.projectiles.splice(i, 1);
    } else { p.x += dx / dist * step; p.y += dy / dist * step; }
  }
  
  for(let i = battle.effects.length - 1; i >= 0; i--){ battle.effects[i].life -= dt; if(battle.effects[i].life <= 0) battle.effects.splice(i, 1); }
  for(let i = battle.particles.length - 1; i >= 0; i--){ const p = battle.particles[i]; p.life -= dt; if(p.life <= 0){ battle.particles.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.vy += (p.gravity || 0) * dt; }
  for(let i = battle.damageTexts.length - 1; i >= 0; i--){ const d = battle.damageTexts[i]; d.life -= dt; d.y += d.vy * dt; if(d.life <= 0) battle.damageTexts.splice(i, 1); }
  
  if(battle.shake > 0){ battle.shake = Math.max(0, battle.shake - dt * 5); const s = battle.shake * 9; battle.shakeX = (Math.random() - 0.5) * s; battle.shakeY = (Math.random() - 0.5) * s; } else { battle.shakeX = 0; battle.shakeY = 0; }
  
  if(battle.state === 'wave' && battle.spawnQueue.length === 0 && battle.enemies.filter(e => e.hp > 0).length === 0){
    battle.state = 'prep'; battle.prepTimer = 15; updateHUD();
  }
}

/* ============ РЕНДЕР ============ */
function drawBackground(t, dt){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#080e22'); g.addColorStop(0.5, '#0a1028'); g.addColorStop(1, '#0d0a24');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  
  const neb = ctx.createRadialGradient(W*0.75, H*0.2, 0, W*0.75, H*0.2, W*0.8);
  neb.addColorStop(0, 'rgba(90,40,200,0.20)'); neb.addColorStop(1, 'rgba(90,40,200,0)');
  ctx.fillStyle = neb; ctx.fillRect(0, 0, W, H);

  for(const s of stars){
    if(!battle || !battle.paused) s.y += s.speed * dt * (battle ? battle.speed : 1);
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    ctx.globalAlpha = s.a; ctx.fillStyle = '#cfe6ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.3); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = 'rgba(90,160,255,0.04)'; ctx.lineWidth = 1;
  for(let i=0; i<=COLS; i++) { ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, H); ctx.stroke(); }
  for(let j=0; j<=ROWS; j++) { ctx.beginPath(); ctx.moveTo(0, j*CELL); ctx.lineTo(W, j*CELL); ctx.stroke(); }
}

function drawPath(){
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(WP[0].x, WP[0].y);
  for(let i = 1; i < WP.length; i++) ctx.lineTo(WP[i].x, WP[i].y);
  ctx.strokeStyle = 'rgba(60,130,255,0.1)'; ctx.lineWidth = 44; ctx.stroke();
  ctx.strokeStyle = 'rgba(60,130,255,0.2)'; ctx.lineWidth = 36; ctx.stroke();
  ctx.strokeStyle = '#0f1a33'; ctx.lineWidth = 30; ctx.stroke();
  ctx.save(); ctx.setLineDash([9, 13]); ctx.strokeStyle = 'rgba(110,200,255,0.4)'; ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();
}

function drawEnemy(e){
  const spawnK = e.spawnAnim || 0;
  let sz = (e.type === 'boss' ? 70 : e.type === 'tank' ? 42 : e.type === 'fast' ? 24 : e.type === 'golden' ? 30 : 32) * (1 - spawnK * 0.5);
  if (e.fadeOut > 0) sz *= Math.max(0, 1 - e.fadeOut);
  if (sz <= 0) return;

  ctx.save(); ctx.translate(e.px, e.py);
  
  // Замедление (иней)
  if (e.slowTimer > 0) {
    ctx.shadowBlur = 15; ctx.shadowColor = '#00ffff';
  }
  
  const wobble = Math.sin(performance.now() / 300 + e.d * 0.05) * 0.1;
  ctx.rotate(wobble);
  const img = IMAGES['enemy_' + e.type];
  if (img) ctx.drawImage(img, -sz/2, -sz/2, sz, sz);
  else ctx.drawImage(SPRITES.enemies[e.type], -sz/2, -sz/2, sz, sz);
  ctx.restore();

  if(e.type !== 'boss' && e.hp > 0) {
    const hw = sz * 0.6, hh = 3;
    const pct = Math.max(0, e.hp / e.maxHp);
    const barY = e.py - sz * 0.6 - 5;
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(e.px - hw, barY, hw * 2, hh);
    ctx.fillStyle = pct > 0.5 ? '#5dff9b' : pct > 0.25 ? '#ffd257' : '#ff5c5c'; ctx.fillRect(e.px - hw, barY, hw * 2 * pct, hh);
  }
}

function drawTower(t, isGhost=false){
  const def = TOWERS[t.key];
  const sel = !isGhost && battle && battle.selectedTower === t;
  const lvl = state.towers[t.key].level + (t.upLvl || 0);
  const hasBuff = battle && battle.towers.some(o => o !== t && Math.abs(o.c - t.c) <= 1 && Math.abs(o.r - t.r) <= 1);

  if(sel || isGhost){
    const st = towerStats(t.key, t.upLvl || 0, hasBuff);
    ctx.beginPath(); ctx.arc(t.x, t.y, st.range, 0, 6.3);
    ctx.fillStyle = hasBuff ? 'rgba(255,215,0,0.1)' : 'rgba(94,231,255,0.08)'; ctx.fill();
    ctx.strokeStyle = hasBuff ? 'rgba(255,215,0,0.6)' : 'rgba(94,231,255,0.55)'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  ctx.save();
  if (isGhost) ctx.globalAlpha = 0.5;
  if (hasBuff) { ctx.shadowBlur = 10; ctx.shadowColor = '#ffd257'; }

  const recoil = t.recoil || 0; const kick = recoil * 5;
  const wob = Math.sin((performance.now() / 500) + t.x) * 0.05;
  const bd = BARREL_DRAW[t.key];
  
  ctx.save(); ctx.translate(t.x, t.y); ctx.rotate((t.angle || 0) + wob); ctx.translate(-kick, 0);
  const barrelImg = IMAGES['tower_' + t.key + '_barrel'];
  if (barrelImg) ctx.drawImage(barrelImg, -bd.w*0.15, -bd.h/2, bd.w * 1.3, bd.h * 1.5); 
  else ctx.drawImage(SPRITES.barrels[t.key], 0, -bd.h / 2, bd.w, bd.h);
  ctx.restore();

  const baseImg = IMAGES['tower_' + t.key + '_base'];
  if (baseImg) ctx.drawImage(baseImg, t.x - 22, t.y - 22, 44, 44);
  else ctx.drawImage(SPRITES.bases[t.key], t.x - 20, t.y - 20, 40, 40);

  if(lvl > 1 && !isGhost){
    ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = '#0a0e1e';
    ctx.strokeText('★'.repeat(Math.min(lvl-1, 3)), t.x, t.y + 24);
    ctx.fillStyle = '#ffd257'; ctx.fillText('★'.repeat(Math.min(lvl-1, 3)), t.x, t.y + 24);
  }
  ctx.restore();
}

function render(t, dt){
  ctx.save();
  if(battle) ctx.translate(battle.shakeX || 0, battle.shakeY || 0);
  ctx.clearRect(-20, -20, W + 40, H + 40);
  drawBackground(t, dt);
  drawPath();
  if(!battle){ ctx.restore(); return; }
  
  // Призрак башни
  if(battle.pendingCell){
    const { c, r } = battle.pendingCell;
    ctx.fillStyle = 'rgba(94,231,255,0.18)'; ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
    ctx.strokeStyle = 'rgba(94,231,255,0.85)'; ctx.lineWidth = 2; ctx.strokeRect(c*CELL+1, r*CELL+1, CELL-2, CELL-2);
    drawTower({ key: 'blaster', c, r, x: c*CELL+CELL/2, y: r*CELL+CELL/2, angle: -Math.PI/2 }, true);
  }
  
  for(const tw of battle.towers) drawTower(tw);
  
  for(const p of battle.projectiles){
    if(!p.trail) continue;
    for(let i = 0; i < p.trail.length; i++){
      const tr = p.trail[i]; const k = (i + 1) / p.trail.length;
      ctx.globalAlpha = k * 0.5; ctx.fillStyle = p.color;
      const rr = (p.kind === 'orb' ? 6 : 3.5) * k;
      ctx.beginPath(); ctx.arc(tr.x, tr.y, rr, 0, 6.3); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for(const p of battle.projectiles){
    ctx.save(); ctx.shadowBlur = 16; ctx.shadowColor = p.color;
    const imgKey = p.kind === 'orb' ? 'orb' : p.kind === 'frost' ? 'frost' : p.kind === 'missile' ? 'missile' : 'bolt';
    const img = IMAGES['proj_' + imgKey];
    if (img) {
      const sz = p.kind === 'orb' ? 28 : p.kind === 'missile' ? 24 : 20;
      ctx.drawImage(img, p.x - sz/2, p.y - sz/2, sz, sz);
    } else {
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 6.3); ctx.fill();
    }
    ctx.restore();
  }
  
  for(const e of battle.enemies) drawEnemy(e);
  
  for(const ef of battle.effects){
    const k = ef.life / ef.max;
    if(ef.type === 'boom'){
      ctx.save(); ctx.globalAlpha = k * 0.9; ctx.strokeStyle = ef.color; ctx.lineWidth = 3 + (1 - k) * 4;
      ctx.beginPath(); ctx.arc(ef.x, ef.y, ef.r * (1.3 - k * 0.9), 0, 6.3); ctx.stroke(); ctx.restore();
    } else if(ef.type === 'beam'){
      ctx.save(); ctx.globalAlpha = k; ctx.strokeStyle = ef.color; ctx.shadowBlur = 20; ctx.shadowColor = ef.color;
      ctx.beginPath(); ctx.moveTo(ef.x1, ef.y1); ctx.lineTo(ef.x2, ef.y2);
      ctx.lineWidth = 5; ctx.globalAlpha = k * 0.5; ctx.stroke();
      ctx.lineWidth = 2; ctx.globalAlpha = k; ctx.stroke(); ctx.restore();
    }
  }
  for(const p of battle.particles){
    const k = Math.max(0, p.life / (p.maxLife || 0.5));
    ctx.globalAlpha = k; ctx.shadowBlur = p.glow !== false ? 10 : 0; ctx.shadowColor = p.color;
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * k, 0, 6.3); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  
  const boss = battle.enemies.find(e => e.type === 'boss' && e.hp > 0);
  if(boss) {
    const bw = W - 40, bh = 6;
    // Щит
    if(boss.shield > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(20, 20, bw, bh);
      ctx.fillStyle = '#5ee7ff'; ctx.fillRect(20, 20, bw * (boss.shield/boss.maxShield), bh);
    }
    // Здоровье
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(20, boss.shield > 0 ? 28 : 20, bw, bh);
    ctx.fillStyle = '#ff0044'; ctx.fillRect(20, boss.shield > 0 ? 28 : 20, bw * (boss.hp/boss.maxHp), bh);
  }

  if(battle.wave === 4 && battle.state === 'prep') {
    ctx.fillStyle = 'rgba(255,0,60,' + (0.2 + Math.sin(performance.now()/100)*0.1) + ')';
    ctx.fillRect(0, H/2 - 30, W, 60);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('⚠️ ВНИМАНИЕ: БОСС ⚠️', W/2, H/2 + 8);
  }

  for(const d of battle.damageTexts) {
    ctx.globalAlpha = Math.max(0, d.life / d.max);
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = d.color; ctx.shadowBlur = 4; ctx.shadowColor = '#000';
    ctx.fillText(d.text, d.x, d.y);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.restore();
}

/* ============ ВЗАИМОДЕЙСТВИЕ ============ */
canvas.addEventListener('pointerdown', (ev) => {
  ev.preventDefault();
  if(!battle || battle.state === 'won' || battle.state === 'lost' || battle.paused) return;
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) / rect.width * W;
  const y = (ev.clientY - rect.top) / rect.height * H;
  handleTap(Math.floor(x / CELL), Math.floor(y / CELL));
});

function handleTap(c, r){
  const existing = battle.towers.find(t => t.c === c && t.r === r);
  if(existing){ selectTower(existing); return; }
  if(!isBuildable(c, r)){ hidePickers(); battle.selectedTower = null; return; }
  battle.selectedTower = null;
  battle.pendingCell = { c, r };
  showTowerPicker();
}
function hidePickers(){
  document.getElementById('towerPicker').classList.add('hidden');
  document.getElementById('towerInfo').classList.add('hidden');
  document.getElementById('battleBottom').classList.remove('hidden');
  if(battle) { battle.pendingCell = null; battle.selectedTower = null; }
}
function showTowerPicker(){
  const el = document.getElementById('towerPicker');
  el.classList.remove('hidden'); document.getElementById('battleBottom').classList.add('hidden');
  el.innerHTML = '';
  for(const key of TOWER_KEYS){
    const def = TOWERS[key], st = towerStats(key);
    const can = state.coins >= def.cost;
    const b = document.createElement('button');
    b.className = 'pickBtn' + (can ? '' : ' disabled');
    b.style.borderColor = can ? def.color : '#2a3550';
    b.innerHTML = `<div class="pickName" style="color:${def.color}">${def.name}</div>
                   <div class="pickDmg">⚔${st.dmg.toFixed(0)}</div>
                   <div class="pickCost">🪙 ${def.cost}</div>`;
    if(can) b.onclick = () => buildTower(key);
    el.appendChild(b);
  }
  const cancel = document.createElement('button');
  cancel.className = 'pickCancel'; cancel.textContent = 'ОТМЕНА'; cancel.onclick = hidePickers;
  el.appendChild(cancel);
}
function buildTower(key){
  if(!battle || !battle.pendingCell) return;
  const def = TOWERS[key];
  if(state.coins < def.cost) return;
  state.coins -= def.cost;
  const { c, r } = battle.pendingCell;
  battle.towers.push({ key, c, r, x:c*CELL+CELL/2, y:r*CELL+CELL/2, cd:0, angle:-Math.PI/2, recoil:0, upLvl:0, targeting:'first' });
  hidePickers(); updateHUD(); save(); playSound('click');
}

function selectTower(t){
  battle.selectedTower = t; battle.pendingCell = null;
  const def = TOWERS[t.key];
  const hasBuff = battle.towers.some(o => o !== t && Math.abs(o.c - t.c) <= 1 && Math.abs(o.r - t.r) <= 1);
  const st = towerStats(t.key, t.upLvl, hasBuff);
  const el = document.getElementById('towerInfo');
  el.classList.remove('hidden'); document.getElementById('battleBottom').classList.add('hidden');
  
  let html = `<div class="infoText"><b style="color:${def.color}">${def.name} ${t.upLvl>0?'(Боевой ур.'+t.upLvl+')':''}</b><br>Урон ${st.dmg.toFixed(1)} · Радиус ${st.range.toFixed(0)} ${hasBuff?'<span style="color:#ffd257">(Бонус соседства!)</span>':''}</div>`;
  
  html += `<div class="targetRow">
    <button class="targetBtn ${t.targeting === 'first' ? 'active' : ''}" onclick="setTarget('first')">Первый</button>
    <button class="targetBtn ${t.targeting === 'last' ? 'active' : ''}" onclick="setTarget('last')">Последний</button>
    <button class="targetBtn ${t.targeting === 'strong' ? 'active' : ''}" onclick="setTarget('strong')">Сильный</button>
    <button class="targetBtn ${t.targeting === 'weak' ? 'active' : ''}" onclick="setTarget('weak')">Слабый</button>
  </div>`;
  
  html += `<div class="actionRow">`;
  if (t.upLvl < 3) {
    const upgradeCost = Math.floor(def.cost * (0.8 + t.upLvl * 0.5));
    const canUp = state.coins >= upgradeCost;
    html += `<button class="infoBtn" ${canUp ? '' : 'disabled style="opacity:0.5"'} onclick="upgradeBattleTower(${upgradeCost})">УЛУЧШИТЬ +${upgradeCost}🪙</button>`;
  } else {
    html += `<button class="infoBtn" disabled style="opacity:0.5">МАКС УРОВЕНЬ</button>`;
  }
  if (battle.undo && battle.undo.tower === t) {
     html += `<button class="infoBtn" style="border-color:#5dff9b; color:#5dff9b" onclick="undoSell()">ОТМЕНИТЬ ПРОДАЖУ</button>`;
  } else {
     html += `<button class="sellBtn" onclick="sellTower()">💸</button>`;
  }
  html += `<button class="cancelBtn" onclick="hidePickers()">✕</button></div>`;
  
  el.innerHTML = html;
}

window.setTarget = function(mode) {
  if(battle && battle.selectedTower) {
    battle.selectedTower.targeting = mode;
    selectTower(battle.selectedTower); // обновить UI
    playSound('click');
  }
};
window.upgradeBattleTower = function(cost) {
  if(battle && battle.selectedTower && state.coins >= cost) {
    state.coins -= cost; battle.selectedTower.upLvl++;
    save(); updateHUD(); selectTower(battle.selectedTower); playSound('click');
  }
};
window.sellTower = function() {
  if(!battle || !battle.selectedTower) return;
  const t = battle.selectedTower;
  const def = TOWERS[t.key];
  const refund = Math.floor(def.cost * 0.5);
  state.coins += refund;
  battle.towers = battle.towers.filter(x => x !== t);
  battle.undo = { tower: t, expire: Date.now() + 3000, refund: refund };
  battle.selectedTower = null; hidePickers(); updateHUD(); save(); playSound('click');
};
window.undoSell = function() {
  if(battle && battle.undo) {
    const u = battle.undo;
    if(Date.now() <= u.expire) {
      state.coins -= u.refund; battle.towers.push(u.tower); battle.selectedTower = u.tower;
      battle.undo = null; updateHUD(); save(); selectTower(battle.selectedTower); playSound('click');
    } else {
      battle.undo = null;
    }
  }
};

/* ============ МАГАЗИН СУНДУКОВ ============ */
function renderChests(){
  const el = document.getElementById('chestList'); el.innerHTML = '';
  const shopDiv = document.createElement('div');
  shopDiv.innerHTML = `<h3 style="font-size:14px; color:#9fb6dd; margin-bottom:10px; letter-spacing:1px;">🛒 КУПИТЬ СУНДУК</h3>`;
  const grid = document.createElement('div'); grid.className = 'shopGrid';
  for(const key in CHEST_DEF) {
    const d = CHEST_DEF[key];
    const btn = document.createElement('div'); btn.className = 'shopBtn';
    btn.innerHTML = `
      <div style="font-size:24px; filter:drop-shadow(0 0 10px ${d.color})">📦</div>
      <div style="font-size:12px; font-weight:bold; color:${d.color}; margin:4px 0">${d.name}</div>
      <div style="font-size:12px; font-weight:bold; color:#ffd257">🪙 ${d.price}</div>
    `;
    btn.onclick = () => {
      if (state.coins >= d.price) {
        state.coins -= d.price; state.chests.push(key);
        save(); refreshMenu(); renderChests(); playSound('click');
      } else alert('Недостаточно золота!');
    };
    grid.appendChild(btn);
  }
  shopDiv.appendChild(grid); el.appendChild(shopDiv);

  if(state.chests.length === 0){
    const empty = document.createElement('div'); empty.className = 'empty';
    empty.innerHTML = 'У тебя пока нет сундуков.<br>Купи выше или побеждай в боях!';
    el.appendChild(empty); return;
  }
  
  const title = document.createElement('h3');
  title.style.cssText = 'font-size:14px; color:#9fb6dd; margin-bottom:10px; letter-spacing:1px;';
  title.textContent = '🎁 ТВОИ СУНДУКИ'; el.appendChild(title);

  state.chests.forEach((k, i) => {
    const d = CHEST_DEF[k];
    const div = document.createElement('div'); div.className = 'chestItem'; div.style.borderColor = d.color;
    div.innerHTML = `<div class="chestBox" style="--c:${d.color}">📦</div><div class="chestName" style="color:${d.color}">${d.name}</div><div class="chestHint">Нажми, чтобы открыть</div>`;
    div.onclick = () => showChestOpen(i, k); el.appendChild(div);
  });
}

function showChestOpen(idx, key){
  const d = CHEST_DEF[key];
  const modal = document.getElementById('chestModal');
  modal.classList.remove('hidden');
  modal.innerHTML = `<div class="bigChest" id="bigChest" style="--c:${d.color}">📦</div><div class="chestTapHint">Нажми на сундук</div>`;
  const bc = document.getElementById('bigChest');
  bc.onclick = () => {
    if(bc.dataset.opened) return;
    bc.dataset.opened = '1'; bc.classList.add('shake'); playSound('click');
    setTimeout(() => { const res = openChest(idx); showChestRewards(res, d); }, 850);
  };
}
function openChest(idx){
  const key = state.chests[idx]; const d = CHEST_DEF[key];
  const res = { cards:{ blaster:0, plasma:0, laser:0, frost:0, tesla:0, missile:0 }, coins:d.coins };
  for(let i = 0; i < d.cards; i++){
    const k = TOWER_KEYS[Math.floor(Math.random() * TOWER_KEYS.length)]; res.cards[k]++;
  }
  state.coins += res.coins;
  for(const k of TOWER_KEYS) state.towers[k].cards += res.cards[k];
  state.chests.splice(idx, 1); save(); return res;
}
function showChestRewards(res, d){
  const modal = document.getElementById('chestModal');
  let html = `<div class="resultTitle" style="color:${d.color};font-size:24px">${d.name.toUpperCase()}</div>`;
  html += `<div class="rewardRow" style="animation-delay:0s"><span class="rewardIcon">🪙</span> +${res.coins} монет</div>`;
  let delay = 0.08;
  for(const k of TOWER_KEYS){
    if(res.cards[k] > 0){
      html += `<div class="rewardRow" style="animation-delay:${delay}s;border-color:${TOWERS[k].color}"><span class="rewardIcon" style="color:${TOWERS[k].color}">🃏</span>${TOWERS[k].name} ×${res.cards[k]}</div>`;
      delay += 0.08;
    }
  }
  html += `<button class="bigBtn" style="max-width:260px;margin-top:14px" id="claimBtn">ЗАБРАТЬ</button>`;
  modal.innerHTML = html; playSound('explode');
  document.getElementById('claimBtn').onclick = () => { modal.classList.add('hidden'); renderChests(); refreshMenu(); };
}

/* ============ БАШНИ (Меню) ============ */
function renderCollection(){
  const el = document.getElementById('collectionList'); el.innerHTML = '';
  for(const key of TOWER_KEYS){
    const def = TOWERS[key], t = state.towers[key], st = towerStats(key);
    const lvl = t.level;
    const need = lvl < MAX_LEVEL ? UPGRADE_COST[lvl - 1] : null;
    const canUp = need !== null && t.cards >= need;
    const div = document.createElement('div'); div.className = 'card';
    div.innerHTML = `
      <div class="cardIcon" style="background:${def.color}20;border-color:${def.color};color:${def.color}">${def.name[0]}</div>
      <div class="cardBody">
        <div class="cardTitle">${def.name} <span class="lvl">ур. ${lvl}</span></div>
        <div class="cardStats">⚔ ${st.dmg.toFixed(1)} · 📡 ${st.range.toFixed(0)} · ⏱ ${(1/st.rate).toFixed(1)}/с</div>
        <div class="cardCards">🃏 ${t.cards}${need !== null ? ' / ' + need : ' · МАКС'}</div>
      </div>
      <button class="upBtn" ${canUp ? '' : 'disabled'}>${need === null ? 'MAX' : 'УЛУЧШИТЬ'}</button>`;
    if(canUp){ div.querySelector('.upBtn').onclick = () => { t.cards -= need; t.level++; save(); renderCollection(); playSound('click'); }; }
    el.appendChild(div);
  }
}

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
function loop(now){
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if(document.getElementById('battle').classList.contains('active')){
    update(dt); render(now / 1000, dt);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

refreshMenu();
showScreen('menu');
</script>
</body>
</html>
